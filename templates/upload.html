{% extends "layout.html" %}

{% block title %}
Upload Data | FigureForge
{% endblock %}

{% block main %}

<section class="page-header">
    <h1>Upload your data</h1>

    <p>
        Select a CSV file containing the data you want
        to graph.
    </p>
</section>

<section class="card">

    {% if error %}
        <div class="alert alert-error" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="form-group">

            <label for="csv-file">
                Choose CSV File
            </label>

            <input
                type="file"
                id="csv-file"
                name="file"
                accept=".csv"
                required
            >

            <p class="form-help">
                Only CSV files are supported.
            </p>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Upload Data
            </button>

            <a
                href="{{ url_for('manual_entry') }}"
                class="button secondary-button"
            >
                Enter Data Manually
            </a>

        </div>

    </form>

</section>

{% endblock %}
